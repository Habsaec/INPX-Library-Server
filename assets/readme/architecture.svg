<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How INPX Library Server works</title>
  <desc id="desc">Sources feed a SQLite index; clients use the web UI, OPDS feed, and Android reader against one API.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d4ac5c"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>

  <text x="56" y="52" fill="#9a8e7e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">ARCHITECTURE</text>
  <text x="56" y="92" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">One index / every client</text>

  <g transform="translate(56 140)">
    <rect width="220" height="160" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <text x="24" y="40" fill="#d4ac5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">01 / SOURCES</text>
    <text x="24" y="78" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">INPX + archives</text>
    <text x="24" y="110" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">ZIP / 7z / folders</text>
    <text x="24" y="138" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">FB2 / EPUB / MOBI</text>
  </g>

  <line x1="290" y1="220" x2="350" y2="220" stroke="#d4ac5c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(366 140)">
    <rect width="240" height="160" rx="16" fill="#272118" stroke="#5a4a30"/>
    <text x="24" y="40" fill="#d4ac5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">02 / INDEX</text>
    <text x="24" y="78" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">SQLite catalog</text>
    <text x="24" y="110" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">search / series / genres</text>
    <text x="24" y="138" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">covers / sidecar</text>
  </g>

  <line x1="620" y1="220" x2="680" y2="220" stroke="#d4ac5c" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(696 120)">
    <rect width="448" height="200" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <text x="24" y="40" fill="#d4ac5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">03 / CLIENTS</text>

    <g transform="translate(24 62)">
      <rect width="128" height="100" rx="12" fill="#14110e" stroke="#3a3126"/>
      <text x="16" y="40" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Web</text>
      <text x="16" y="68" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">reader</text>
    </g>
    <g transform="translate(164 62)">
      <rect width="128" height="100" rx="12" fill="#14110e" stroke="#3a3126"/>
      <text x="16" y="40" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">OPDS</text>
      <text x="16" y="68" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">/opds</text>
    </g>
    <g transform="translate(304 62)">
      <rect width="120" height="100" rx="12" fill="#14110e" stroke="#3a3126"/>
      <text x="16" y="40" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Android</text>
      <text x="16" y="68" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">sync API</text>
    </g>
  </g>
</svg>
