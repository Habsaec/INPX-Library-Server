<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">INPX Library Server</title>
  <desc id="desc">Self-hosted ebook library: catalog, browser reading, OPDS, and e-reader delivery from INPX and FB2 archives.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="55%" stop-color="#181510"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#231f1a"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1671b"/>
      <stop offset="100%" stop-color="#d4ac5c"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#e8e0d4" opacity="0.035"/>
      <circle cx="4" cy="3.5" r="0.5" fill="#d4ac5c" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grain)"/>

  <g transform="translate(28 48)" opacity="0.9">
    <rect x="0" y="20" width="14" height="260" rx="2" fill="#5c4030"/>
    <rect x="18" y="8" width="11" height="272" rx="2" fill="#3d4a5c"/>
    <rect x="33" y="28" width="13" height="252" rx="2" fill="#6b3a2a"/>
    <rect x="50" y="14" width="10" height="266" rx="2" fill="#2f4a3a"/>
    <rect x="64" y="34" width="12" height="246" rx="2" fill="#7a5a28"/>
    <rect x="4" y="70" width="6" height="2" fill="#d4ac5c" opacity="0.55"/>
    <rect x="21" y="55" width="5" height="2" fill="#e8e0d4" opacity="0.35"/>
    <rect x="37" y="90" width="5" height="2" fill="#d4ac5c" opacity="0.45"/>
    <rect x="67" y="110" width="6" height="2" fill="#e8e0d4" opacity="0.3"/>
  </g>

  <g transform="translate(120 78)">
    <text x="0" y="0" fill="#9a8e7e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">SELF-HOSTED / INPX / FB2</text>
    <text x="0" y="64" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="700">INPX Library</text>
    <text x="0" y="118" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="700">Server</text>
    <rect x="0" y="142" width="72" height="3" rx="1.5" fill="url(#gold)"/>
    <text x="0" y="186" fill="#c9bba8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Home ebook library: search, browser reading,</text>
    <text x="0" y="218" fill="#c9bba8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">OPDS catalog, and send-to-device delivery.</text>
    <g transform="translate(0 248)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect x="0" y="-18" width="88" height="28" rx="8" fill="#272118" stroke="#3a3126"/>
      <text x="16" y="2" fill="#d4ac5c">FB2</text>
      <rect x="98" y="-18" width="98" height="28" rx="8" fill="#272118" stroke="#3a3126"/>
      <text x="114" y="2" fill="#d4ac5c">EPUB</text>
      <rect x="206" y="-18" width="92" height="28" rx="8" fill="#272118" stroke="#3a3126"/>
      <text x="222" y="2" fill="#d4ac5c">OPDS</text>
      <rect x="308" y="-18" width="118" height="28" rx="8" fill="#272118" stroke="#3a3126"/>
      <text x="324" y="2" fill="#d4ac5c">Android</text>
    </g>
  </g>

  <g transform="translate(700 52)">
    <rect width="444" height="276" rx="18" fill="url(#panel)" stroke="#3a3126"/>
    <rect x="18" y="18" width="408" height="36" rx="10" fill="#1a1612" stroke="#3a3126"/>
    <circle cx="38" cy="36" r="5" fill="#9a8e7e" opacity="0.5"/>
    <text x="54" y="42" fill="#9a8e7e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">search: author / series / genre</text>

    <g transform="translate(18 72)">
      <rect width="124" height="168" rx="10" fill="#14110e" stroke="#3a3126"/>
      <rect x="10" y="10" width="104" height="108" rx="6" fill="#2a231c"/>
      <rect x="28" y="28" width="18" height="72" rx="2" fill="#6b3a2a"/>
      <rect x="50" y="22" width="14" height="78" rx="2" fill="#3d4a5c"/>
      <rect x="68" y="32" width="16" height="68" rx="2" fill="#7a5a28"/>
      <text x="12" y="140" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Catalog</text>
      <text x="12" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">INPX / folders</text>

      <g transform="translate(140 0)">
        <rect width="124" height="168" rx="10" fill="#14110e" stroke="#3a3126"/>
        <rect x="10" y="10" width="104" height="108" rx="6" fill="#221c16"/>
        <rect x="22" y="34" width="80" height="8" rx="2" fill="#d4ac5c" opacity="0.7"/>
        <rect x="22" y="52" width="64" height="6" rx="2" fill="#9a8e7e" opacity="0.45"/>
        <rect x="22" y="68" width="72" height="6" rx="2" fill="#9a8e7e" opacity="0.35"/>
        <rect x="22" y="84" width="48" height="6" rx="2" fill="#9a8e7e" opacity="0.25"/>
        <text x="12" y="140" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Reader</text>
        <text x="12" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">FB2 / EPUB</text>
      </g>

      <g transform="translate(280 0)">
        <rect width="124" height="168" rx="10" fill="#14110e" stroke="#3a3126"/>
        <rect x="10" y="10" width="104" height="108" rx="6" fill="#1c211c"/>
        <circle cx="62" cy="54" r="28" fill="none" stroke="#d4ac5c" stroke-width="3"/>
        <path d="M52 54 L60 62 L74 46" fill="none" stroke="#d4ac5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="12" y="140" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">OPDS</text>
        <text x="12" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">KOReader+</text>
      </g>
    </g>
  </g>
</svg>
