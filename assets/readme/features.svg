<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Core capabilities</title>
  <desc id="desc">Search and catalog, browser reader, conversion and email delivery, OPDS for e-reader apps.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="26" fill="url(#bg)"/>

  <g transform="translate(40 40)">
    <rect width="260" height="200" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <rect x="24" y="28" width="36" height="36" rx="8" fill="#272118" stroke="#5a4a30"/>
    <circle cx="42" cy="46" r="8" fill="none" stroke="#d4ac5c" stroke-width="2.5"/>
    <path d="M48 52 L54 58" stroke="#d4ac5c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="24" y="100" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Search</text>
    <text x="24" y="136" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Authors, series,</text>
    <text x="24" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">genres, filters</text>
  </g>

  <g transform="translate(326 40)">
    <rect width="260" height="200" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <rect x="24" y="28" width="36" height="36" rx="8" fill="#272118" stroke="#5a4a30"/>
    <rect x="32" y="36" width="20" height="20" rx="2" fill="none" stroke="#d4ac5c" stroke-width="2"/>
    <path d="M36 42 H48 M36 48 H44" stroke="#d4ac5c" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="100" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Reader</text>
    <text x="24" y="136" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">FB2 / EPUB, themes,</text>
    <text x="24" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">position, bookmarks</text>
  </g>

  <g transform="translate(612 40)">
    <rect width="260" height="200" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <rect x="24" y="28" width="36" height="36" rx="8" fill="#272118" stroke="#5a4a30"/>
    <path d="M42 34 V52 M34 46 L42 54 L50 46" fill="none" stroke="#d4ac5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="100" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Delivery</text>
    <text x="24" y="136" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">ZIP, convert,</text>
    <text x="24" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">email to Kindle</text>
  </g>

  <g transform="translate(898 40)">
    <rect width="262" height="200" rx="16" fill="#231f1a" stroke="#3a3126"/>
    <rect x="24" y="28" width="36" height="36" rx="8" fill="#272118" stroke="#5a4a30"/>
    <path d="M32 46 H52 M36 40 L30 46 L36 52 M48 40 L54 46 L48 52" fill="none" stroke="#d4ac5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="100" fill="#e8e0d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Clients</text>
    <text x="24" y="136" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">OPDS, Android,</text>
    <text x="24" y="162" fill="#9a8e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">sync by bookId</text>
  </g>
</svg>
